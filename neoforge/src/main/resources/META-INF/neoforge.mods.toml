modLoader = "javafml"
loaderVersion = "[4,)"
#issueTrackerURL = ""
license = "MIT"

[[mods]]
modId = "ddjade"
version = "${version}"
displayName = "Dungeon Difficulty x Jade"
authors = "KevzCz"
description = '''
Addon for Jade that shows information about Dungeon Difficulty's Power Level
'''
logoFile = "assets/ddjade/icon.png"

[[dependencies.ddjade]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ddjade]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ddjade]]
modId = "architectury"
type = "required"
versionRange = "[13.0.8,)"
ordering = "AFTER"
side = "BOTH"

# Optional: the Difficulty+ zone line is skipped when it is absent.
# AFTER so its API is initialized before our provider queries it.
[[dependencies.ddjade]]
modId = "difficultyplus"
type = "optional"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "ddjade.mixins.json"
